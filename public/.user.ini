; The app's own validation (StoreProjectRequest/UpdateProjectRequest) allows
; attachments up to 100MB, including video files - but PHP's own defaults
; (usually 2M/8M) silently reject or truncate anything near that size before
; Laravel ever gets to run that validation, which is what turns a legitimate
; large/multi-file upload into a raw "connection reset"/413 instead of a
; proper validation error. This raises PHP's own ceiling to match.
upload_max_filesize = 110M
post_max_size = 110M
max_file_uploads = 20
max_execution_time = 300
max_input_time = 300
